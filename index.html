<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CNC Portalfräsen - Research-Eingabe</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        .container { max-width: 700px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        textarea { width: 100%; height: 180px; margin-top: 15px; font-family: monospace; box-sizing: border-box; }
        .hint { margin-top: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <h2>Neue Research-Eingabe</h2>
    <p class="hint">Nur Hersteller ausfüllen = Hersteller-Discovery. Baureihe und Modell ausfüllen = konkrete Maschine. Die Eingaben werden als <strong>research_queue.json</strong> heruntergeladen und anschließend ins GitHub-Repository übernommen.</p>

    <form id="machineForm">
        <label for="manufacturer">Hersteller:</label>
        <input type="text" id="manufacturer" required placeholder="z.B. Sorotec">

        <label for="series">Baureihe (optional):</label>
        <input type="text" id="series" placeholder="z.B. Basic-Line">

        <label for="model">Modell (optional):</label>
        <input type="text" id="model" placeholder="z.B. Basic-Line 0605">

        <label for="variant">Variante (optional):</label>
        <input type="text" id="variant" placeholder="z.B. Standard / Performance Kit">

        <label for="source_url">Hersteller-/Quellseite (optional):</label>
        <input type="url" id="source_url" placeholder="https://...">

        <button type="button" onclick="addEntry()">Zur Queue hinzufügen</button>
        <button type="button" onclick="downloadQueue()">research_queue.json herunterladen</button>
    </form>

    <h3>Research-Eingaben</h3>
    <textarea id="jsonOutput" readonly></textarea>
</div>

<script>
    let entries = [];

    function downloadQueue() {\n        const blob = new Blob([JSON.stringify({ entries }, null, 2)], { type: "application/json" });\n        const url = URL.createObjectURL(blob);\n        const a = document.createElement("a");\n        a.href = url;\n        a.download = "research_queue.json";\n        a.click();\n        URL.revokeObjectURL(url);\n    }\n\n    function addEntry() {
        const manufacturer = document.getElementById('manufacturer').value.trim();
        const series = document.getElementById('series').value.trim();
        const model = document.getElementById('model').value.trim();
        const variant = document.getElementById('variant').value.trim() || "Standard";
        const sourceUrl = document.getElementById('source_url').value.trim();

        if (!manufacturer) return;

        const entry = {
            id: Date.now().toString(),
            manufacturer_name: manufacturer,
            series: series || null,
            model: model || null,
            variant: variant,
            source_url: sourceUrl || null,
            status: (!series && !model) ? "pending_discovery" : "pending_machine",
            added_at: new Date().toISOString().split('T')[0]
        };

        entries.push(entry);
        document.getElementById('jsonOutput').value = JSON.stringify(entries, null, 2);
        document.getElementById('machineForm').reset();
    }
</script>
</body>
</html>
